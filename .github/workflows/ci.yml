name: Campus Connect - Integración Continua (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Compilación y Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio (Checkout)
      uses: actions/checkout@v4

    - name: Configurar SDK de .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restaurar dependencias NuGet
      run: dotnet restore

    - name: Compilar solución (Release)
      run: dotnet build --no-restore --configuration Release

    - name: Ejecutar pruebas automatizadas (xUnit)
      run: dotnet test --no-build --configuration Release --verbosity normal
